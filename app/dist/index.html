<style>
/* Layout: registro a sinistra (società e sezioni) + area di lavoro con tabelle dense in stile partitario */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #eaefed;
  --line: #d5ddda;
  --line-strong: #b9c6c2;
  --ink: #16211e;
  --ink-2: #53625d;
  --ink-3: #7b8a85;
  --accent: #1b5d64;
  --accent-ink: #ffffff;
  --accent-soft: #d9eaeb;
  --ok: #2c7a4c;
  --ok-soft: #dff0e5;
  --warn: #9a6100;
  --warn-soft: #f8ecd0;
  --bad: #b2362e;
  --bad-soft: #f7dfdb;
  --info: #34529f;
  --info-soft: #e1e8f7;
  --shadow: 0 1px 2px rgba(22, 33, 30, .06), 0 4px 16px rgba(22, 33, 30, .06);
  --overlay: rgba(16, 24, 22, .45);
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-display: "IBM Plex Serif", Georgia, "Times New Roman", serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #151d1c; --surface-2: #1c2625; --line: #2a3634; --line-strong: #3a4946;
    --ink: #e3ebe9; --ink-2: #9caba7; --ink-3: #74837f; --accent: #5db0b7; --accent-ink: #0b1514; --accent-soft: #1d3739;
    --ok: #6cc690; --ok-soft: #173224; --warn: #e3a93c; --warn-soft: #3a2c11; --bad: #ef7f74; --bad-soft: #3d1d1a;
    --info: #92aaf0; --info-soft: #1d2640; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --overlay: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #151d1c; --surface-2: #1c2625; --line: #2a3634; --line-strong: #3a4946;
  --ink: #e3ebe9; --ink-2: #9caba7; --ink-3: #74837f; --accent: #5db0b7; --accent-ink: #0b1514; --accent-soft: #1d3739;
  --ok: #6cc690; --ok-soft: #173224; --warn: #e3a93c; --warn-soft: #3a2c11; --bad: #ef7f74; --bad-soft: #3d1d1a;
  --info: #92aaf0; --info-soft: #1d2640; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --overlay: rgba(0,0,0,.6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
a { color: var(--accent); }
.mono, code { font-family: var(--font-mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }

/* barra superiore */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--font-display); font-size: 17px; font-weight: 600; letter-spacing: .01em; }
.brand span { color: var(--ink-3); font-size: 12.5px; }
.top .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.pill.cloud .dot { background: var(--ok); }
.pill.browser .dot { background: var(--warn); }
.pill.memoria .dot { background: var(--bad); }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 56px); }
.side { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 18px; }
.side .group { display: flex; flex-direction: column; gap: 2px; }
.side .group .label { padding: 0 8px 6px; }
.navbtn { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r);
  padding: 7px 8px; cursor: pointer; color: var(--ink); }
.navbtn:hover { background: var(--surface-2); }
.navbtn.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.navbtn .sub { color: var(--ink-3); font-size: 12px; font-weight: 400; }
.navbtn .count { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); font-weight: 600; }
main { min-width: 0; padding-block: 22px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pagehead h1 { font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.pagehead .meta { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--ink-3); font-size: 13px; }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-h h2 { font-size: 16px; font-weight: 600; }
.card-h h3 { font-size: 14px; font-weight: 600; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 16px; }

/* bottoni e campi */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  border-radius: var(--r); padding: 7px 12px; cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.field small { color: var(--ink-3); font-size: 12px; }
.inp, select.inp, textarea.inp { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 7px 9px; min-width: 0; }
textarea.inp { min-height: 120px; font-family: var(--font-mono); font-size: 12.5px; }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.check { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg button[disabled] { cursor: not-allowed; opacity: .55; }

/* chip di stato */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.neutral { background: var(--surface-2); color: var(--ink-2); }
.tag { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }

/* tabelle */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; background: var(--surface-2);
  padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t tbody tr.click { cursor: pointer; }
table.t tbody tr.click:hover td { background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
table.t tr.sel td { background: var(--accent-soft); }
table.t td.descr { min-width: 260px; max-width: 460px; }
table.t td.descr .d1 { word-break: break-word; }
.amt-in { color: var(--ok); }
.amt-out { color: var(--ink); }
.abb { display: flex; flex-direction: column; gap: 2px; min-width: 200px; }
.abb .l1 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.abb .l2 { color: var(--ink-2); font-size: 12.5px; }
.problem { color: var(--bad); font-size: 12px; }
tr.stripe-da td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
tr.stripe-sugg td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
tr.stripe-inc td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
tr.stripe-ok td:first-child { box-shadow: inset 3px 0 0 var(--ok); }

/* periodi */
.years { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.yearbtn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r); padding: 4px 11px; cursor: pointer; font-variant-numeric: tabular-nums; font-weight: 500; }
.yearbtn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.ptile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-height: 92px; }
.ptile:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.ptile .pt { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.ptile .pt small { font-weight: 400; color: var(--ink-3); font-size: 11.5px; }
.ptile .pc { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ptile.vuoto { background: transparent; border-style: dashed; }
.ptile.futuro { opacity: .6; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.stat b { font-size: 18px; font-variant-numeric: tabular-nums; font-weight: 600; }
.stat.bad b { color: var(--bad); }
.stat.warn b { color: var(--warn); }
.stat.ok b { color: var(--ok); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--ink-2); font-weight: 500; margin-bottom: -1px; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button .n { font-size: 11.5px; color: var(--ink-3); margin-left: 4px; }

.empty { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 28px 22px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; background: var(--surface); }
.empty h2 { font-family: var(--font-display); font-size: 21px; font-weight: 600; }
.empty p { margin: 0; max-width: 64ch; color: var(--ink-2); }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.note { border-left: 3px solid var(--info); background: var(--info-soft); padding: 9px 12px; border-radius: 0 6px 6px 0; font-size: 13px; }
.note.warn { border-color: var(--warn); background: var(--warn-soft); }
.note.bad { border-color: var(--bad); background: var(--bad-soft); }

.bulk { position: sticky; bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 5; background: var(--ink); color: var(--surface); border-radius: 8px; padding: 9px 12px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow); }
.bulk .btn { background: transparent; color: var(--surface); border-color: color-mix(in srgb, var(--surface) 40%, transparent); }

/* modale */
#modal { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding-block: max(24px, env(safe-area-inset-top, 0px)) 24px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.modal-card { background: var(--surface); border-radius: 10px; width: min(760px, 100%); box-shadow: var(--shadow); display: flex; flex-direction: column; }
.modal-card.wide { width: min(1080px, 100%); }
.mh { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.mh h2 { font-size: 17px; font-weight: 600; }
.mb { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.mf { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.mf .left { margin-right: auto; }
.descbox { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.descbox .d { font-family: var(--font-mono); font-size: 12.5px; word-break: break-word; }

#toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface);
  padding: 9px 14px; border-radius: 8px; box-shadow: var(--shadow); max-width: calc(100% - 32px); font-size: 13.5px; }
#toast.err { background: var(--bad); color: #fff; }

.loading { padding: 60px 0; text-align: center; color: var(--ink-2); }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .side .group { flex-direction: row; flex-wrap: wrap; gap: 4px; }
  .side .group .label { width: 100%; padding-bottom: 2px; }
  .navbtn { width: auto; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .brand span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</div>

</div>

const str = (v) => (v == null ? '' : typeof v === 'number' ? String(Number.isInteger(v) ? v : v) : String(v).trim());

function isoData(y, m, d) {
  if (!(y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (dt.getUTCMonth() !== m - 1) return null;
  return `${y}-${pad(m)}-${pad(d)}`;
}
function parseData(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return isoData(v.getFullYear(), v.getMonth() + 1, v.getDate());
  if (typeof v === 'number') {
    if (v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return isoData(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
    return null;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2,4})\b/);
  if (m) { let y = +m[3]; if (y < 100) y += 2000; return isoData(y, +m[2], +m[1]); }
  m = s.match(/^(\d{4})[\-\/.](\d{1,2})[\-\/.](\d{1,2})/);
  if (m) return isoData(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{2})(\d{2})(\d{4})$/);
  if (m) return isoData(+m[3], +m[2], +m[1]);
  return null;
}
function parseNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v ?? '').trim().replace(/\s|€|EUR/gi, '');
  if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  if (s.startsWith('+')) s = s.slice(1);
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc > -1) s = (s.match(/,/g).length > 1) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (ld > -1 && s.match(/\./g).length > 1) s = s.replace(/\./g, '');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  const n = parseFloat(s);
  return neg ? -n : n;
}

const ultimoGiorno = (y, m) => `${y}-${pad(m)}-${pad(new Date(Date.UTC(y, m, 0)).getUTCDate())}`;
function periodiAnno(anno, tipo) {
  if (tipo === 'T') return [1, 2, 3, 4].map((q) => ({ key: `${anno}-T${q}`, label: `${q}° trimestre`, breve: `T${q} · ${MESI[q * 3 - 3].slice(0, 3)}–${MESI[q * 3 - 1].slice(0, 3)}`, da: `${anno}-${pad(q * 3 - 2)}-01`, a: ultimoGiorno(anno, q * 3) }));
  return MESI.map((m, i) => ({ key: `${anno}-${pad(i + 1)}`, label: m, breve: m, da: `${anno}-${pad(i + 1)}-01`, a: ultimoGiorno(anno, i + 1) }));
}
function periodoDaKey(key) {
  const [y, p] = key.split('-');
  return p.startsWith('T') ? periodiAnno(+y, 'T')[+p.slice(1) - 1] : periodiAnno(+y, 'M')[+p - 1];
}

const Store = {
  mode: 'memoria', db: null, idb: null, mem: new Map(), counts: new Map(),
  pending: new Map(), timer: null, flushing: false, listeners: [],
  async init() {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const db = await window.claude.use('db');
        if (db) { this.db = db; this.mode = 'cloud'; return; }
      }
    } catch (e) { /* passa al browser */ }
    try { this.idb = await this.apriIdb(); this.mode = 'browser'; } catch (e) { this.mode = 'memoria'; }
  },
  apriIdb() {
    return new Promise((res, rej) => {
      try {
        const rq = indexedDB.open('emvas-estratti-conto', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      } catch (e) { rej(e); }
    });
  },
  idbOp(mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.idb.transaction('kv', mode);
      const rq = fn(tx.objectStore('kv'));
      tx.oncomplete = () => res(rq && rq.result);
      tx.onerror = () => rej(tx.error);
    });
  },
  async get(key) {
    if (this.pending.has(key)) return structuredClone(this.pending.get(key));
    if (this.mode === 'cloud') return this.cloudGet(key);
    if (this.mode === 'browser') { try { return await this.idbOp('readonly', (s) => s.get(key)); } catch (e) { return undefined; } }
    return this.mem.has(key) ? structuredClone(this.mem.get(key)) : undefined;
  },
  async cloudGet(key, tentativo = 0) {
    const s0 = await this.db.doc(`kv/${key}~0`).get();
    if (!s0.exists) { this.counts.set(key, 0); return undefined; }
    const d0 = s0.data();
    const altri = [];
    for (let i = 1; i < d0.n; i++) altri.push(this.db.doc(`kv/${key}~${i}`).get());
    const snaps = await Promise.all(altri);
    const parti = [d0.s];
    for (const sn of snaps) {
      const d = sn.exists ? sn.data() : null;
      if (!d || d.v !== d0.v) {
        if (tentativo < 2) { await new Promise((r) => setTimeout(r, 400)); return this.cloudGet(key, tentativo + 1); }
        throw new Error('Documento incompleto: ' + key);
      }
      parti.push(d.s);
    }
    this.counts.set(key, d0.n);
    return JSON.parse(parti.join(''));
  },
  async cloudSet(key, val) {
    const testo = JSON.stringify(val);
    const CH = 60000;
    const n = Math.max(1, Math.ceil(testo.length / CH));
    const v = uid();
    let prima = this.counts.get(key);
    if (prima == null) { const s0 = await this.db.doc(`kv/${key}~0`).get(); prima = s0.exists ? s0.data().n : 0; }
    for (let i = n - 1; i >= 0; i--) await this.db.doc(`kv/${key}~${i}`).set({ n, v, s: testo.slice(i * CH, (i + 1) * CH) });
    for (let i = n; i < prima; i++) await this.db.doc(`kv/${key}~${i}`).delete();
    this.counts.set(key, n);
  },
  async cloudDel(key) {
    let n = this.counts.get(key);
    if (n == null) { const s0 = await this.db.doc(`kv/${key}~0`).get(); n = s0.exists ? s0.data().n : 0; }
    for (let i = n - 1; i >= 0; i--) await this.db.doc(`kv/${key}~${i}`).delete();
    this.counts.set(key, 0);
  },
  save(key, val) {
    this.pending.set(key, val === undefined ? undefined : structuredClone(val));
    this.notify();
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 450);
  },
  remove(key) { this.save(key, undefined); },
  async flush() {
    if (this.flushing) { this.timer = setTimeout(() => this.flush(), 300); return; }
    this.flushing = true;
    try {
      while (this.pending.size) {
        const [key, val] = this.pending.entries().next().value;
        this.pending.delete(key);
        try {
          if (this.mode === 'cloud') { if (val === undefined) await this.cloudDel(key); else await this.cloudSet(key, val); }
          else if (this.mode === 'browser') await this.idbOp('readwrite', (s) => (val === undefined ? s.delete(key) : s.put(val, key)));
          else { if (val === undefined) this.mem.delete(key); else this.mem.set(key, val); }
          this.lastError = null;
        } catch (e) {
          this.lastError = e;
          if (!this.pending.has(key)) this.pending.set(key, val);
          const quota = e && e.code === 'quota_exceeded';
          toast(quota ? 'Archivio pieno: elimina periodi o società non più necessari, poi riprova.' : 'Salvataggio non riuscito, nuovo tentativo tra pochi secondi.', true);
          this.flushing = false;
          this.notify();
          this.timer = setTimeout(() => this.flush(), quota ? 30000 : 4000);
          return;
        }
        this.notify();
      }
    } finally { this.flushing = false; this.notify(); }
  },
  notify() { const el = $('#saveTxt'); if (el) el.textContent = this.pending.size ? 'Salvataggio…' : (this.lastError ? 'Non salvato' : 'Tutto salvato'); },
};
window.addEventListener('beforeunload', (e) => { if (Store.pending.size) { e.preventDefault(); e.returnValue = ''; } });

    } else imp = parseNum(row[m.importo]);
    if (imp == null || Math.abs(imp) < 0.005) continue;
    if (m.inverti) imp = -imp;
    const descr = [row[m.descr], m.descr2 != null && m.descr2 !== '' ? row[m.descr2] : ''].map(str).filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
    out.push({ data, valuta: m.valuta != null && m.valuta !== '' ? parseData(row[m.valuta]) || '' : '', descr, importo: round2(imp) });
  }

}

/* ===================================================== download file */
let _downloads;
function capDownloads() {
  if (_downloads === undefined) _downloads = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
  return _downloads;
}
async function scarica(filename, data, mime) {
  const dl = await capDownloads();
  if (dl) {
    try { await dl.save({ filename, data }); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Download annullato.'); return false; }
      if (e && e.code === 'rate_limited') { toast('C’è già una richiesta di download aperta: confermala o chiudila, poi riprova.', true); return false; }
      if (e && !['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { toast('Download non riuscito: ' + (e.message || e.code), true); return false; }
    }
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  return true;
}

let _import = null;
function apriMappatura(soc, cc, rows, nomeFile) {
  if (!rows.length) { toast('Il file non contiene righe.', true); return; }
  const f = cc.formato;
  let m;
  if (f && f.headers) {
    const hr = f.headerRow < rows.length ? f.headerRow : trovaRigaIntestazione(rows, GUESS_EC);
    const h = (rows[hr] || []).map((x) => norm(x));
    const idx = (name) => (name == null || name === '' ? '' : h.indexOf(name));
    m = { headerRow: hr, modo: f.modo, inverti: f.inverti, data: idx(f.headers.data), valuta: idx(f.headers.valuta), descr: idx(f.headers.descr), descr2: idx(f.headers.descr2), importo: idx(f.headers.importo), dare: idx(f.headers.dare), avere: idx(f.headers.avere) };
    for (const k of ['data', 'valuta', 'descr', 'descr2', 'importo', 'dare', 'avere']) if (m[k] === -1) m[k] = '';
    if (m.data === '' || m.descr === '') m = null;
  }
  if (!m) {
    const hr = trovaRigaIntestazione(rows, GUESS_EC);
    const g = indovinaColonne(rows[hr] || [], GUESS_EC);
    m = { headerRow: hr, modo: g.importo == null && g.dare != null ? 'dareavere' : 'unico', inverti: false, data: g.data ?? '', valuta: g.valuta ?? '', descr: g.descr ?? '', descr2: g.descr2 ?? '', importo: g.importo ?? '', dare: g.dare ?? '', avere: g.avere ?? '' };
  }
  _import = { rows, m, nomeFile };
  apriModale(htmlMappatura(soc, cc), { wide: true, onClose: () => { _import = null; } });
}

      <label class="check"><input type="radio" name="mMerge" value="aggiungi"><span>Aggiungi solo i movimenti nuovi (scarta i duplicati)</span></label></div>` : ''}
  </div>

function confermaImport(soc, cc) {
  const { rows, m, nomeFile } = _import;
  const p = periodoDaKey(S.ui.pkey);
  let mov = costruisciMovimenti(rows, m);
  if ($('#mFuori')?.checked) mov = mov.filter((r) => r.data >= p.da && r.data <= p.a);
  const merge = document.querySelector('input[name=mMerge]:checked')?.value || 'sostituisci';
  const per = S.per[kPer(soc.id, cc.id, p.key)];
  const h = rows[m.headerRow] || [];
  const nome = (i) => (i === '' || i == null ? '' : norm(h[i]));
  cc.formato = { headerRow: m.headerRow, modo: m.modo, inverti: m.inverti, headers: { data: nome(m.data), valuta: nome(m.valuta), descr: nome(m.descr), descr2: nome(m.descr2), importo: nome(m.importo), dare: nome(m.dare), avere: nome(m.avere) } };
  const vecchie = new Map();
  for (const r of per.righe) { const k = firma(r); if (!vecchie.has(k)) vecchie.set(k, []); vecchie.get(k).push(r); }
  const ctx = contesto(soc);
  let nuove = [], tenute = 0, scartate = 0;
  let ord = merge === 'aggiungi' ? Math.max(0, ...per.righe.map((r) => r.ord || 0)) + 1 : 1;
  for (const x of mov) {
    const lst = vecchie.get(firma(x));
    const old = lst && lst.length ? lst.shift() : null;
    if (merge === 'aggiungi' && old) { scartate++; continue; }
    const r = { id: uid(), ord: ord++, data: x.data, valuta: x.valuta, descr: x.descr, importo: x.importo, abb: null, fonte: null, regolaId: null };
    if (old && old.abb) { r.abb = old.abb; r.fonte = old.fonte; r.regolaId = old.regolaId; tenute++; }
    else abbinaRiga(soc, ctx, r, cc.id);
    nuove.push(r);
  }
  per.righe = merge === 'aggiungi' ? per.righe.concat(nuove) : nuove;
  per.file = nomeFile; per.caricato = new Date().toISOString();
  _modalOnClose = null; _import = null;
  chiudiModale();
  salvaPeriodo(soc, cc.id, p.key);
  const auto = nuove.filter((r) => r.fonte === 'regola').length;
  toast(`${nuove.length} movimenti importati · ${auto} abbinati da regola${tenute ? ` · ${tenute} abbinamenti mantenuti` : ''}${scartate ? ` · ${scartate} duplicati scartati` : ''}`);
  render();
}

  const sp = document.querySelector('[data-sez=partita]'); if (sp) sp.hidden = !conPart;
  const sr = document.querySelector('[data-sez=registro]'); if (sr) sr.hidden = t !== 0;
  $('#edContoLab').textContent = conPart ? 'Conto (vuoto = mastro del cliente/fornitore)' : 'Conto di contropartita *';
  if (conPart && !$('#edPartita').value && _edit && _edit.ids.length === 1) {
    const r = S.per[kPer(soc.id, S.ui.ccId, S.ui.pkey)].righe.find((x) => x.id === _edit.ids[0]);
    if (r) $('#edPartita').value = suggerisciPartita(r.descr, r.data);
  }
}
function salvaAbbinamento(soc, form, dopo) {
  const fd = new FormData(form);
  const ctx0 = contesto(soc);
  const per = S.per[kPer(soc.id, S.ui.ccId, S.ui.pkey)];
  const righe = per.righe.filter((r) => _edit.ids.includes(r.id));
  const nnCodice = str(fd.get('nnCodice')), nnNome = str(fd.get('nnNome'));
  if (nnCodice || nnNome) {
    if (!nnCodice || !nnNome) { toast('Per il nuovo nominativo servono codice e ragione sociale.', true); return; }
    const lst = S.nom[soc.id];
    if (lst.some((n) => n.c === nnCodice)) { toast(`Il codice ${nnCodice} esiste già in anagrafica.`, true); return; }
    lst.push({ c: nnCodice, d: nnNome, tipo: fd.get('nnTipo'), piva: str(fd.get('nnPiva')), cf: str(fd.get('nnCf')).toUpperCase(), conto: codiceDa(fd.get('nnConto')), alias: '' });
    salvaNom(soc);
  }
  const a = {
    causale: str(fd.get('causale')), conto: codiceDa(fd.get('conto')),
    nominativo: codiceDa(fd.get('nominativo')) || nnCodice, partita: str(fd.get('partita')), descr: str(fd.get('descr')), registro: str(fd.get('registro') || ''),
  };
  if (!a.causale) { toast('Scegli la causale.', true); return; }
  const t = tipoCausale(ctx0, a.causale);
  if (!CON_PARTITA.has(t)) a.partita = '';
  let rg = null;
  if (fd.get('memo')) {
    const parole = norm(fd.get('parole'));
    if (!parole) { toast('Indica almeno una parola per la regola, oppure togli la spunta «Memorizza come regola».', true); return; }
    rg = {
      id: uid(), parole, segno: str(fd.get('segno')), importo: fd.get('importoFisso') ? Math.abs(righe[0].importo) : null, ccId: fd.get('soloCc') ? S.ui.ccId : '',
      causale: a.causale, conto: a.conto, nominativo: a.nominativo, partita: '', descr: a.descr, registro: a.registro, origine: 'manuale', creata: new Date().toISOString(),
    };
    const lst = S.reg[soc.id];
    const dup = lst.find((x) => x.parole === rg.parole && x.segno === rg.segno && (x.importo ?? null) === (rg.importo ?? null) && (x.ccId || '') === rg.ccId);
    if (dup) { Object.assign(dup, { causale: rg.causale, conto: rg.conto, nominativo: rg.nominativo, descr: rg.descr, registro: rg.registro, modificata: rg.creata }); rg = dup; }
    else lst.push(rg);
    salvaReg(soc);
  }
  for (const r of righe) {
    r.abb = Object.assign({}, a);
    if (CON_PARTITA.has(t) && righe.length > 1 && !a.partita) r.abb.partita = suggerisciPartita(r.descr, r.data);
    r.fonte = 'manuale'; r.regolaId = rg ? rg.id : null;
  }
  let altre = 0;
  if (rg) {
    const ctx = contesto(soc);
    const dn = (r) => ' ' + norm(r.descr) + ' ';
    for (const r of per.righe) {
      if (_edit.ids.includes(r.id) || r.fonte === 'manuale' || (r.abb && r.fonte === 'regola' && r.regolaId !== rg.id)) continue;
      if (regolaCorrisponde(rg, r, S.ui.ccId, dn(r)) < 0) continue;
      r.abb = abbDaRegola(soc, ctx, rg, r); r.fonte = 'regola'; r.regolaId = rg.id; altre++;
    }
  }
  S.ui.sel = new Set();
  const idCorrente = _edit.ids[0];
  _modalOnClose = null; _edit = null;
  chiudiModale();
  salvaPeriodo(soc, S.ui.ccId, S.ui.pkey);
  toast(`Abbinamento salvato${rg ? ` · regola «${rg.parole}»` : ''}${altre ? ` applicata ad altri ${altre} movimenti` : ''}`);
  render();
  if (dopo === 'prossimo') {
    const ctx = contesto(soc);
    const ord = per.righe.slice().sort((x, y) => x.data.localeCompare(y.data) || x.ord - y.ord);
    const i = ord.findIndex((x) => x.id === idCorrente);
    const next = ord.slice(i + 1).concat(ord.slice(0, i + 1)).find((x) => statoRiga(soc, ctx, x) !== 'ok');
    if (next) apriEditor(soc, [next.id]); else toast('Tutti i movimenti del periodo sono pronti.');
  }
}

async function genera(soc, cc) {
  const per = S.per[kPer(soc.id, cc.id, S.ui.pkey)];
  const transitorio = !!$('#usaTransitorio')?.checked;
  const ris = generaTracciato(soc, cc, per, { transitorio });
  if (ris.errori.length) { toast(`${ris.errori.length} movimenti non sono pronti. Completali o spunta l’opzione del conto transitorio.`, true); S.ui.filtro = 'da'; render(); return; }
  if (!ris.movimenti) { toast('Nessun movimento da esportare.', true); return; }
  const file = `Koinos_${slug(soc.nome)}_${slug(cc.nome)}_${S.ui.pkey}.csv`;
  const dati = soc.export.enc === 'cp1252' ? codificaCp1252(ris.testo) : '﻿' + ris.testo;
  const ok = await scarica(file, dati, 'text/csv');
  if (!ok) return;
  per.esportazioni.push({ data: new Date().toISOString(), file, movimenti: ris.movimenti, transitorio: ris.nTrans });
  salvaPeriodo(soc, cc.id, S.ui.pkey, { esportato: true });
  toast(`File generato: ${ris.movimenti} registrazioni.`);
  render();
}

function apriImportTabella(soc, tab, rows, nomeFile) {

function righeImportTabella() {
  const { tab, rows, m } = _import;
  const def = TABELLE[tab];
  const out = [];
  for (let i = m.headerRow + 1; i < rows.length; i++) {
    const r = rows[i] || [];
    const x = {};
    for (const [k] of def.campi.concat([['iva'], ['u']])) if (m[k] != null && m[k] !== '') x[k] = str(r[m[k]]);
    if (!x.c) continue;
    if (tab === 'causali') {
      x.t = parseInt(x.t, 10); if (isNaN(x.t)) x.t = 0;
      x.iva = x.iva != null ? ['1', 'TRUE', 'VERO', 'SI', 'S'].includes(String(x.iva).toUpperCase()) || x.iva === '1.0' : TIPI_IVA.has(x.t);
      x.u = x.u != null ? !['0', '0.0', 'FALSE', 'NO', 'N', ''].includes(String(x.u).toUpperCase()) : true;
    }
    if (tab === 'nom') {
      const tp = norm(x.tipo);
      x.tipo = tp.startsWith('F') ? 'F' : tp.startsWith('C') ? 'C' : (tp ? 'A' : 'C');
      if (x.cf) x.cf = x.cf.toUpperCase();
    }
    if (tab === 'registri') {
      const tp = norm(x.tipo);
      x.tipo = tp.startsWith('A') || tp === '2' ? 'A' : tp.startsWith('C') || tp === '3' ? 'C' : tp.startsWith('V') || tp === '1' ? 'V' : (x.tipo || '');
    }
    out.push(x);
  }
  return out;
}

/* ============================================================ riepilogo */
function datiRiepilogo(soc) {
  const ctx = contesto(soc);
  const f = S.ui.riep;
  const q = norm(f.testo);
  const out = [];
  for (const [chiave] of Object.entries(soc.stati)) {
    const [ccId, pkey] = chiave.split('|');
    if (f.cc && f.cc !== ccId) continue;
    if (f.anno && !pkey.startsWith(f.anno)) continue;
    const per = S.per[kPer(soc.id, ccId, pkey)];
    if (!per) continue;
    const cc = soc.conti.find((c) => c.id === ccId);
    for (const r of per.righe) {
      const st = statoRiga(soc, ctx, r);
      const fonte = r.fonte || 'nessuna';
      if (f.fonte && f.fonte !== fonte && !(f.fonte === 'aperti' && st !== 'ok')) continue;
      if (f.causale && (r.abb?.causale || '') !== f.causale) continue;
      const conto = r.abb ? contoContropartita(soc, ctx, r.abb) : '';
      const nom = r.abb?.nominativo ? ctx.nom.get(r.abb.nominativo) : null;
      const riga = { cc: cc?.nome || '?', ccId, pkey, data: r.data, descr: r.descr, importo: r.importo, causale: r.abb?.causale || '', causaleD: ctx.caus.get(r.abb?.causale)?.d || '', conto, contoD: ctx.pdc.get(conto)?.d || '', nominativo: r.abb?.nominativo || '', nominativoD: nom?.d || '', partita: r.abb?.partita || '', fonte, stato: st, regola: r.regolaId ? (S.reg[soc.id] || []).find((x) => x.id === r.regolaId)?.parole || '' : '' };
      if (q && !norm(Object.values(riga).join(' ')).includes(q)) continue;
      out.push(riga);
    }
  }
  return out.sort((a, b) => a.data.localeCompare(b.data));
}

  const causaliUsate = [...new Set(Object.entries(S.per).filter(([k]) => k.startsWith(`per_${soc.id}_`)).flatMap(([, p]) => p.righe.map((r) => r.abb?.causale)).filter(Boolean))].sort();
  return `<div class="wrap"><div class="pagehead"><div><h1>Riepilogo abbinamenti</h1><div class="meta">${esc(soc.nome)} · tutti i movimenti lavorati, con causale, contropartita e origine dell’abbinamento</div></div>

function corpoRiepilogo(soc) {
  const dati = datiRiepilogo(soc);

  const gruppi = new Map();
  for (const d of dati) {
    const k = `${d.causale}|${d.conto}|${d.nominativo}`;
    if (!gruppi.has(k)) gruppi.set(k, { causale: d.causale, causaleD: d.causaleD, conto: d.conto, contoD: d.contoD, nominativo: d.nominativo, nominativoD: d.nominativoD, n: 0, ent: 0, usc: 0, regola: 0, manuale: 0 });

  return `<div class="stats"><div class="stat"><span class="label">Movimenti</span><b>${dati.length}</b></div><div class="stat"><span class="label">Entrate</span><b class="amt-in">${fmtEur(tot.e)}</b></div><div class="stat"><span class="label">Uscite</span><b>${fmtEur(tot.u)}</b></div>

  <section class="card"><div class="card-h"><h2>Per causale e contropartita</h2></div><div class="tablewrap"><table class="t"><thead><tr><th>Causale</th><th>Contropartita</th><th>Nominativo</th><th class="num">Movimenti</th><th class="num">Entrate</th><th class="num">Uscite</th><th class="num">Da regola</th><th class="num">Manuali</th></tr></thead><tbody>

/* ============================================================ backup */
async function creaBackup() {
  const out = { app: 'emvas-estratti-conto', versione: 1, creato: new Date().toISOString(), societa: [] };
  for (const s of S.index.societa) {
    const soc = await caricaSocieta(s.id);
    if (!soc) continue;
    await caricaTuttiPeriodi(soc);
    const periodi = {};
    for (const k of Object.keys(soc.stati)) { const [cc, p] = k.split('|'); periodi[k] = S.per[kPer(soc.id, cc, p)]; }
    out.societa.push({ soc, pdc: S.pdc[soc.id], nom: S.nom[soc.id], reg: S.reg[soc.id], periodi });
  }
  return out;
}
async function ripristinaBackup(dati) {
  for (const b of dati.societa) {
    const soc = b.soc; migraSocieta(soc);
    S.soc[soc.id] = soc; S.pdc[soc.id] = b.pdc || []; S.nom[soc.id] = b.nom || []; S.reg[soc.id] = b.reg || [];
    Store.save(kSoc(soc.id), soc); Store.save(kPdc(soc.id), S.pdc[soc.id]); Store.save(kNom(soc.id), S.nom[soc.id]); Store.save(kReg(soc.id), S.reg[soc.id]);
    for (const [k, per] of Object.entries(b.periodi || {})) { const [cc, p] = k.split('|'); S.per[kPer(soc.id, cc, p)] = per; Store.save(kPer(soc.id, cc, p), per); }
    const e = S.index.societa.find((x) => x.id === soc.id);
    if (e) e.nome = soc.nome; else S.index.societa.push({ id: soc.id, nome: soc.nome });
  }
  salvaIndex();
}

}

const CAMBI = {
  selRiga: (el) => { if (el.checked) S.ui.sel.add(el.dataset.id); else S.ui.sel.delete(el.dataset.id); el.closest('tr').classList.toggle('sel', el.checked); $('#bulkBar').innerHTML = barraSelezione(); },
  selTutte: (el) => {
    const soc = socCorrente(); const per = S.per[kPer(soc.id, S.ui.ccId, S.ui.pkey)];
    for (const r of righeFiltrate(soc, contesto(soc), per)) { if (el.checked) S.ui.sel.add(r.id); else S.ui.sel.delete(r.id); }
    $('#tblMov').innerHTML = tabellaMovimenti(soc, contesto(soc), per); $('#bulkBar').innerHTML = barraSelezione();
  },
  mappa: (el) => {
    const soc = socCorrente(); const k = el.dataset.k;
    _import.m[k] = k === 'inverti' ? el.checked : k === 'headerRow' ? +el.value : k === 'modo' ? el.value : (el.value === '' ? '' : +el.value);
    if (k === 'headerRow') { const g = indovinaColonne(_import.rows[_import.m.headerRow] || [], GUESS_EC); Object.assign(_import.m, { data: g.data ?? '', valuta: g.valuta ?? '', descr: g.descr ?? '', descr2: g.descr2 ?? '', importo: g.importo ?? '', dare: g.dare ?? '', avere: g.avere ?? '' }); }
    $('#modalCard').innerHTML = htmlMappatura(soc, soc.conti.find((c) => c.id === S.ui.ccId));
  },
  mappaTab: (el) => {
    const k = el.dataset.k;
    _import.m[k] = k === 'headerRow' ? +el.value : (el.value === '' ? '' : +el.value);
    if (k === 'headerRow') Object.assign(_import.m, indovinaColonne(_import.rows[_import.m.headerRow] || [], TABELLE[_import.tab].guess));
    $('#modalCard').innerHTML = htmlImportTabella(socCorrente());
  },
  edCausale: () => aggiornaEditorCausale(socCorrente()),
  socCampo: (el) => {
    const soc = socCorrente(); const k = el.dataset.k;
    let v = el.value; if (['mastroClienti', 'mastroFornitori', 'contoTransitorio'].includes(k)) v = codiceDa(v);
    if (k === 'nome' && !v.trim()) { toast('La ragione sociale non può essere vuota.', true); el.value = soc.nome; return; }
    soc[k] = typeof v === 'string' ? v.trim() : v; salvaSoc(soc);
    if (k === 'nome' || k === 'tipoCont') renderSide();
    if (['mastroClienti', 'mastroFornitori', 'contoTransitorio', 'partitaMancante'].includes(k)) aggiornaStati(soc);
    toast('Salvato.');
  },
  expCampo: (el) => { const soc = socCorrente(); soc.export[el.dataset.k] = el.type === 'checkbox' ? el.checked : el.value; salvaSoc(soc); toast('Salvato.'); },
  riep: (el) => { S.ui.riep[el.dataset.k] = el.value; $('#riepBody').innerHTML = corpoRiepilogo(socCorrente()); },
  regTestSegno: (el) => { S.ui.regTestSegno = el.value; render(); },
};
async function aggiornaStati(soc) {
  await caricaTuttiPeriodi(soc);
  for (const k of Object.keys(soc.stati)) { const [cc, p] = k.split('|'); salvaPeriodo(soc, cc, p, { mantieni: true }); }
}
const INPUT = {
  cercaMov: (el) => { S.ui.cerca = el.value; const soc = socCorrente(); $('#tblMov').innerHTML = tabellaMovimenti(soc, contesto(soc), S.per[kPer(soc.id, S.ui.ccId, S.ui.pkey)]); },
  tabCerca: (el) => {
    S.ui.tabCerca = el.value; S.ui.tabLimite = 200;
    const soc = socCorrente(); const tab = S.ui.datiTab; const def = TABELLE[tab]; const q = norm(el.value);
    const lista = def.lista(soc) || [];
    $('#tblTab').innerHTML = tabellaVoci(soc, tab, q ? lista.filter((x) => norm(def.campi.map(([k]) => x[k]).join(' ')).includes(q)) : lista);
  },
  regCerca: debounce((el) => { S.ui.regCerca = el.value; rerenderMantenendoFocus(); }, 250),
  regTest: debounce((el) => { S.ui.regTest = el.value; rerenderMantenendoFocus(); }, 250),
  riepTesto: debounce((el) => { S.ui.riep.testo = el.value; $('#riepBody').innerHTML = corpoRiepilogo(socCorrente()); }, 250),
};
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
async function rerenderMantenendoFocus() {
  const id = document.activeElement?.id; const pos = document.activeElement?.selectionStart;
  await render();
  if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { /* select */ } } }
}
const FORMS = {
  nuovaSoc: (form) => {
    const fd = new FormData(form);
    const soc = nuovaSocieta({ nome: str(fd.get('nome')), cf: str(fd.get('cf')).toUpperCase(), tipoCont: fd.get('tipoCont') });
    S.soc[soc.id] = soc; S.pdc[soc.id] = []; S.nom[soc.id] = []; S.reg[soc.id] = [];
    S.index.societa.push({ id: soc.id, nome: soc.nome }); salvaIndex();
    const fine = () => { salvaSoc(soc); salvaPdc(soc); salvaNom(soc); salvaReg(soc); chiudiModale(); vai({ socId: soc.id, view: 'dati', datiTab: 'generale' }); toast('Società creata: completa i dati di base e aggiungi i conti correnti.'); };
    if (fd.get('copia')) caricaSocieta(fd.get('copia')).then((s) => { if (s) copiaDatiBase(s, soc); fine(); }); else fine();
  },
  salvaCc: (form) => {
    const soc = socCorrente(); const fd = new FormData(form); const id = form.dataset.cc;
    const dati = { nome: str(fd.get('nome')), banca: str(fd.get('banca')), iban: str(fd.get('iban')).replace(/\s/g, '').toUpperCase(), codiceConto: codiceDa(fd.get('codiceConto')) };
    if (id) Object.assign(soc.conti.find((c) => c.id === id), dati);
    else soc.conti.push(Object.assign({ id: uid(), anni: { [fd.get('anno')]: fd.get('tipo') } }, dati));
    salvaSoc(soc); chiudiModale(); render(); toast('Conto corrente salvato.');
  },
  salvaAbb: (form, ev) => salvaAbbinamento(socCorrente(), form, ev.submitter?.value || 'chiudi'),
  salvaVoce: (form) => {
    const soc = socCorrente(); const tab = form.dataset.tab; const def = TABELLE[tab]; const fd = new FormData(form);
    const x = {}; for (const [k] of def.campi) x[k] = str(fd.get(k));
    if (tab === 'causali') { x.t = +x.t; x.iva = TIPI_IVA.has(x.t); x.u = !!fd.get('u'); }
    if (tab === 'nom') { x.cf = x.cf.toUpperCase(); x.conto = codiceDa(x.conto); }
    const lista = (def.lista(soc) || []).slice(); const orig = form.dataset.orig;
    if (x.c !== orig && lista.some((v) => v.c === x.c)) { toast(`Il codice ${x.c} esiste già.`, true); return; }
    const i = orig ? lista.findIndex((v) => v.c === orig) : -1;
    if (i >= 0) lista[i] = Object.assign({}, lista[i], x); else lista.push(x);
    def.set(soc, lista); chiudiModale(); render(); toast('Salvato.');
  },
  salvaRegola: async (form) => {
    const soc = socCorrente(); const fd = new FormData(form); const id = form.dataset.id;
    const imp = str(fd.get('importo')) ? Math.abs(parseNum(fd.get('importo'))) : null;
    const dati = { parole: norm(fd.get('parole')), segno: str(fd.get('segno')), importo: imp == null || isNaN(imp) ? null : imp, ccId: str(fd.get('ccId')), causale: str(fd.get('causale')), conto: codiceDa(fd.get('conto')), nominativo: codiceDa(fd.get('nominativo')), descr: str(fd.get('descr')), registro: str(fd.get('registro') || '') };
    if (!dati.parole) { toast('Indica almeno una parola.', true); return; }
    const lst = S.reg[soc.id];
    let rg;
    if (id) { rg = lst.find((x) => x.id === id); Object.assign(rg, dati, { modificata: new Date().toISOString() }); }
    else { rg = Object.assign({ id: uid(), partita: '', origine: 'regole', creata: new Date().toISOString() }, dati); lst.push(rg); }
    salvaReg(soc);
    let n = 0;
    if (fd.get('riapplica')) {
      await caricaTuttiPeriodi(soc);
      for (const k of Object.keys(soc.stati)) {
        const [cc, p] = k.split('|'); const per = S.per[kPer(soc.id, cc, p)];
        if (per.esportazioni.length && soc.stati[k].exp) continue;
        const m = riapplica(soc, per, cc, true); if (m) { n += m; salvaPeriodo(soc, cc, p); }
      }
    }
    chiudiModale(); render(); toast(`Regola salvata${n ? ` e applicata a ${n} movimenti` : ''}.`);
  },
};

document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'TR' && e.target.closest('input,select,textarea,label,a')) return;
  const fn = AZIONI[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try { await fn(el, e); } catch (err) { console.error(err); toast(err.message || String(err), true); }
});
document.addEventListener('change', (e) => { const el = e.target.closest('[data-ch]'); if (el && CAMBI[el.dataset.ch]) CAMBI[el.dataset.ch](el, e); });
document.addEventListener('input', (e) => { const el = e.target.closest('[data-in]'); if (el && INPUT[el.dataset.in]) INPUT[el.dataset.in](el, e); });
document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  try { FORMS[form.dataset.form](form, e); } catch (err) { console.error(err); toast(err.message || String(err), true); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'edConto' || e.target.id === 'edNom') {
    const soc = socCorrente(); const ctx = contesto(soc); const v = codiceDa(e.target.value);
    if (e.target.id === 'edConto') $('#edContoDesc').textContent = v ? (ctx.pdc.get(v)?.d || (ctx.pdc.size ? 'Non nel piano dei conti' : '')) : '';
    else $('#edNomDesc').textContent = v ? (ctx.nom.get(v)?.d || 'Non in anagrafica') : 'Obbligatorio per incassi e pagamenti';
  }
});

/* ============================================================ avvio */
async function avvio() {
  await Store.init();
  const pill = $('#storagePill');
  pill.classList.add(Store.mode);
  $('#storageTxt').textContent = { cloud: 'Archivio online', browser: 'Archivio in questo browser', memoria: 'Dati non salvati' }[Store.mode];
  pill.title = { cloud: 'I dati sono salvati nell’archivio della pagina su claude.ai', browser: 'I dati restano in questo browser: scarica backup regolari', memoria: 'Il browser non permette il salvataggio: scarica un backup prima di chiudere' }[Store.mode];
  try { S.index = (await Store.get('index')) || { societa: [] }; } catch (e) { toast('Archivio non raggiungibile: ' + (e.message || e.code), true); }
  const u = leggiUi();
  if (u) Object.assign(S.ui, u, { sel: new Set() });
  if (S.ui.socId && S.index.societa.some((s) => s.id === S.ui.socId)) { try { await caricaSocieta(S.ui.socId); } catch (e) { S.ui.socId = null; } }
  else if (S.index.societa.length === 1) { await caricaSocieta(S.index.societa[0].id); S.ui.socId = S.index.societa[0].id; S.ui.view = 'periodi'; }
  else S.ui.socId = null;
  if (!S.soc[S.ui.socId]) { S.ui.socId = null; S.ui.view = 'home'; }
  Store.notify();
  await render();
}
avvio();

</script>
