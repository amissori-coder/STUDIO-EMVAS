services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    container_name: studio-emvas
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: "file:../data/emvas.db"
      DATA_DIR: /app/data
      TZ: Europe/Rome
    volumes:
      - ./data:/app/data
